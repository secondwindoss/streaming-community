name: CI

on:
  push:
    branches:
    - main
    - release/*
  pull_request:
    branches:
    - main
    - release/*
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Setup
      run: |
        set -ex
        python -m pip install uv
        uv pip install --system --torch-backend cpu -e '.[dev]'
    - name: Run pre-commit
      run: pre-commit run --all-files --show-diff-on-failure

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python_version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python_version }}
    - name: Install with pip
      run: |
        set -ex
        python -m pip install --upgrade pip wheel
        python -m pip install .
    - name: Import
      run: python -c "import streaming; print(streaming.__version__)"

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Setup
      run: python -m pip install uv
    - name: Resolve .[all] with numpy 2.5 and transformers 5 on Python 3.12
      # Fails if the bounds in setup.py cannot be satisfied together with current numpy and transformers.
      run: |
        set -ex
        uv pip compile --python-version 3.12 --extra all \
          --constraint <(printf 'numpy>=2.5\ntransformers>=5\n') \
          --no-annotate --no-header setup.py -o "$RUNNER_TEMP/resolved-3.12.txt"
        grep -E '^(numpy|transformers|huggingface-hub|pyspark)==' "$RUNNER_TEMP/resolved-3.12.txt"
    - name: Resolve .[all] with transformers 5 on Python 3.10
      # numpy 2.5 needs Python 3.11, so only transformers is constrained here.
      run: |
        set -ex
        uv pip compile --python-version 3.10 --extra all \
          --constraint <(printf 'transformers>=5\n') \
          --no-annotate --no-header setup.py -o "$RUNNER_TEMP/resolved-3.10.txt"
        grep -E '^(numpy|transformers|huggingface-hub|pyspark)==' "$RUNNER_TEMP/resolved-3.10.txt"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python_version:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python_version }}
    - name: Setup
      run: |
        set -ex
        python -m pip install uv
        uv pip install --system --torch-backend cpu -e '.[all]'
    - name: Run tests
      # Each group runs in its own process because shared memory is not fully cleaned up between tests.
      run: |
        status=0
        for group in $(seq 1 11); do
          echo "::group::pytest group $group of 11"
          pytest --splits 11 --group "$group" --cov-fail-under=10 --timeout=600 || status=1
          echo "::endgroup::"
        done
        exit $status

  ci-ok:
    if: always()
    needs:
    - lint
    - install
    - resolve
    - test
    runs-on: ubuntu-latest
    steps:
    - name: Check required jobs
      if: >-
        contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        || contains(needs.*.result, 'skipped')
      run: |
        echo "Required jobs: ${{ join(needs.*.result, ', ') }}"
        exit 1
    - run: echo "All required jobs passed."
