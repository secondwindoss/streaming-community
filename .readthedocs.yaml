# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# Build documentation in the docs/ directory with Sphinx, treating warnings as
# errors like `make -C docs html` does
sphinx:
  builder: html
  configuration: docs/source/conf.py
  fail_on_warning: true

# Install the package together with the docs toolchain
python:
  install:
  - method: pip
    path: .[docs]
